<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Slides and recordings from Luca Baggi's talks.">
  <link rel="canonical" href="https://talks.baggiponte.com/">
  <title>talks · luca baggi</title>
  <script>
    // Same "color-theme" values as the blog's toggle: light (default), dark or system.
    const theme = localStorage.getItem("color-theme") || "light";
    const dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.classList.toggle("dark", dark);
  </script>
  <style>
    :root {
      --bg: #f7f5f0; --ink: #151922; --muted: #687083; --border: rgba(18, 24, 38, .1); --link: hsl(212, 80%, 45%);
      color-scheme: light; font-family: system-ui, sans-serif; color: var(--ink);
      background: radial-gradient(circle at top left, rgba(99, 102, 241, .08), transparent 26rem), var(--bg) fixed;
    }
    :root.dark {
      --bg: #0e1014; --ink: #edf0f6; --muted: #9aa3b5; --border: rgba(229, 231, 235, .12); --link: hsl(212, 100%, 72%);
      color-scheme: dark;
    }
    body { max-width: 64rem; margin: 0 auto; padding: 48px 24px; line-height: 1.6; }
    nav { display: flex; justify-content: space-between; align-items: center; }
    nav, footer { font-size: .9rem; color: var(--muted); }
    a { color: var(--link); text-underline-offset: 3px; }
    nav a { color: inherit; }
    /* Mirrors the blog's hextra theme toggle: icon button plus a light/dark/system menu. */
    .theme { position: relative; }
    .theme button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    .theme > button { display: flex; padding: 8px; border-radius: 999px; }
    .theme > button:hover, [role=menu] button:hover { background: var(--border); color: var(--ink); }
    .theme svg { width: 24px; height: 24px; }
    .theme:not([data-theme=light]) .light, .theme:not([data-theme=dark]) .dark, .theme:not([data-theme=system]) .system { display: none; }
    [role=menu] { position: absolute; right: 0; top: 100%; z-index: 1; min-width: 100px; padding: 4px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, .1); }
    [role=menu] button { display: block; width: 100%; padding: 6px 36px 6px 12px; border-radius: 4px; text-align: left; position: relative; }
    [role=menu] [aria-checked=true]::after { content: "✓"; position: absolute; right: 12px; }
    header { margin: 64px 0 40px; }
    h1 { font-size: clamp(2.5rem, 8vw, 4rem); line-height: 1.1; letter-spacing: -.04em; margin: 0; }
    header p { color: var(--muted); font-size: 1.1rem; }
    article { padding: 26px 0; border-top: 1px solid var(--border); }
    h2 { font-size: 1.35rem; line-height: 1.3; letter-spacing: -.025em; margin: 0 0 8px; }
    h2 a { color: inherit; text-decoration: none; }
    h2 a:hover { color: var(--link); }
    article p { margin: 8px 0 16px; color: var(--muted); }
    /* Every edition of a talk, newest first, as a timeline: a dot per edition on a thin line, then slides / video / code. */
    .editions { list-style: none; margin: 4px 0 0; padding: 0 0 0 28px; font-size: .9rem; }
    .editions li { position: relative; display: grid; grid-template-columns: 6.5rem minmax(0, 1fr) auto; gap: 0 16px; padding: 7px 0; }
    .editions li::before { content: ""; position: absolute; left: -24px; top: 14px; width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--muted); background: var(--bg); z-index: 1; }
    .editions li:first-child::before { border-color: var(--link); background: var(--link); box-shadow: 0 0 0 4px color-mix(in srgb, var(--link) 18%, transparent); }
    .editions li:not(:last-child)::after { content: ""; position: absolute; left: -19.5px; top: 19px; height: 100%; width: 1px; background: var(--muted); opacity: .35; }
    .editions time { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .editions li:first-child > span:first-of-type { font-weight: 600; }
    .editions .links { display: grid; grid-template-columns: repeat(3, 3.25rem); gap: 8px; justify-items: end; }
    .editions .links a { color: var(--muted); text-decoration-color: var(--border); }
    .editions .links a:hover { color: var(--link); text-decoration-color: currentColor; }
    /* Organiser logos (site/venues.json) on a small white tile, so dark marks stay visible in dark mode. */
    .logo { display: inline-block; box-sizing: border-box; width: 20px; height: 20px; margin-right: 8px; vertical-align: -5px; }
    img.logo { padding: 2px; border-radius: 5px; background: #fff; box-shadow: 0 0 0 1px var(--border); object-fit: contain; }
    /* Date column as in the blog's post list. */
    article { display: grid; grid-template-columns: minmax(0, 1fr) 8.5rem; column-gap: 2rem; }
    article > * { grid-column: 1; }
    /* Editions span the date column too, so the link columns end flush with the date. */
    article > .editions { grid-column: 1 / -1; }
    article > time { grid-column: 2; grid-row: 1; justify-self: end; white-space: nowrap; color: var(--muted); font-size: .95rem; line-height: 1.5; }
    footer { margin-top: 48px; }
    :focus-visible { outline: 2px solid var(--link); outline-offset: 5px; }
    @media (max-width: 480px) { body { padding-top: 24px; } header { margin-top: 48px; } }
    @media (max-width: 640px) { article { grid-template-columns: 1fr; } article > time { grid-column: 1; grid-row: auto; justify-self: start; } .editions li { grid-template-columns: 1fr; padding: 6px 0; } .editions .links { justify-items: start; } }
    /* Timeline view: every appearance as a dot on one time axis, stacked where dates are close, then listed by year. */
    .views { display: flex; justify-content: start; gap: 20px; margin: -12px 0 12px; font-size: .95rem; }
    .views a { color: var(--muted); text-decoration: none; padding-bottom: 4px; border-bottom: 2px solid transparent; }
    .views a:hover { color: var(--ink); }
    .views a[aria-current] { color: var(--ink); border-color: var(--link); }
    main:not([data-view=timeline]) > .timeline, main:not([data-view=map]) > .map, main:not([data-view=talks]) > article { display: none; }
    :is(.timeline, .map) { padding-top: 32px; border-top: 1px solid var(--border); }
    .axis { position: relative; height: calc(var(--rows) * 16px + 40px); margin: 0 6px; }
    .axis::before { content: ""; position: absolute; left: -6px; right: -6px; bottom: 22px; height: 1px; background: var(--muted); opacity: .35; }
    .axis span { position: absolute; bottom: 0; padding-left: 4px; font-size: .8rem; line-height: 1; color: var(--muted); font-variant-numeric: tabular-nums; }
    .axis span::before { content: ""; position: absolute; left: 0; bottom: 14px; height: 12px; width: 1px; background: var(--muted); opacity: .35; }
    .axis button { position: absolute; bottom: calc(28px + var(--row) * 16px); width: 12px; height: 12px; padding: 0; translate: -50%; border-radius: 50%; border: 1.5px solid var(--muted); background: var(--bg); cursor: pointer; }
    .axis button::before { content: ""; position: absolute; inset: -4px; }
    :is(.timeline, .map) [data-talk] { transition: opacity .15s; }
    :is(.timeline, .map).active [data-talk]:not(.on) { opacity: .25; }
    :is(.timeline, .map) li.on::before, .axis .on { border-color: var(--link); background: var(--link); box-shadow: 0 0 0 4px color-mix(in srgb, var(--link) 18%, transparent); }
    .total { margin: 0 0 8px; color: var(--muted); }
    .total strong { color: var(--ink); }
    .axis b { margin-left: 6px; font-weight: 600; color: var(--ink); }
    :is(.timeline, .map) h2 span { margin-left: 12px; font-weight: 400; font-size: .9rem; }
    .caption { margin: 12px 0 0; min-height: 3.2em; color: var(--muted); }
    .caption strong { color: var(--ink); }
    :is(.timeline, .map) h2 { margin: 28px 0 4px; font-size: 1rem; color: var(--muted); font-variant-numeric: tabular-nums; }
    :is(.timeline, .map) ol { list-style: none; margin: 0; padding: 0; }
    :is(.timeline, .map) li { position: relative; display: grid; grid-template-columns: 6.5rem minmax(0, 1fr); gap: 0 16px; padding: 8px 0 8px 28px; border-top: 1px solid var(--border); cursor: pointer; }
    :is(.timeline, .map) li::before { content: ""; position: absolute; left: 4px; top: 15px; width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--muted); background: var(--bg); }
    :is(.timeline, .map) li time { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
    :is(.timeline, .map) li > span { color: var(--muted); }
    :is(.timeline, .map) .talk { display: block; color: var(--ink); font-weight: 600; }
    :is(.timeline, .map) .talk a { color: inherit; text-decoration: none; }
    :is(.timeline, .map) .talk a:hover { color: var(--link); }
    @media (max-width: 640px) { :is(.timeline, .map) li { grid-template-columns: 1fr; } }
    /* Map view: Europe as dots, a circle per city sized by its talks; a city shows its talks, a talk lights its cities. */
    .places { position: relative; container-type: inline-size; }
    .places svg { display: block; width: 100%; height: auto; }
    .places path { stroke: color-mix(in srgb, var(--ink) 22%, transparent); stroke-width: 3.2; stroke-linecap: round; }
    .place { position: absolute; left: var(--x); top: var(--y); width: max(10px, calc(var(--r) * 200cqw / 960)); aspect-ratio: 1; translate: -50% -50%; padding: 0; border-radius: 50%; border: 1.5px solid var(--muted); background: color-mix(in srgb, var(--link) 35%, var(--bg)); font: inherit; cursor: pointer; transition: opacity .15s; }
    .place::before { content: ""; position: absolute; inset: -4px; border-radius: 50%; }
    .place span { position: absolute; top: 50%; left: calc(100% + 6px); translate: 0 -50%; white-space: nowrap; font-size: .85rem; font-weight: 600; color: var(--ink); text-shadow: 0 0 2px var(--bg), 0 0 4px var(--bg), 0 0 6px var(--bg); pointer-events: none; }
    .place.left span { left: auto; right: calc(100% + 6px); }
    .place b { font-weight: 400; color: var(--muted); }
    .place.online { width: auto; aspect-ratio: auto; padding: 2px 14px; border-radius: 999px; border-style: dashed; background: var(--bg); }
    .place.online span { position: static; translate: none; font-weight: 400; color: var(--muted); }
    .place.on { border-color: var(--link); background: var(--link); box-shadow: 0 0 0 4px color-mix(in srgb, var(--link) 18%, transparent); }
    .place.on b { color: var(--link); }
    .place.online.on :is(span, b) { color: var(--bg); text-shadow: none; }
    .map.active .place:not(.on) { opacity: .3; }
    .card { display: none; position: absolute; left: var(--x); top: var(--y); z-index: 2; width: min(22rem, 75cqw); translate: 24px -18px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, .1); font-size: .85rem; color: var(--muted); }
    .card.west { translate: calc(-100% - 24px) -18px; }
    .card.up { translate: 24px calc(18px - 100%); }
    .card.west.up { translate: calc(-100% - 24px) calc(18px - 100%); }
    .card.on { display: block; }
    .card strong { margin-right: 6px; color: var(--ink); }
    .map .card ol { margin-top: 6px; }
    .map .card li { grid-template-columns: 6rem minmax(0, 1fr); gap: 0 10px; padding: 4px 0; cursor: auto; }
    .map .card li::before { content: none; }
    .card li > span { color: var(--ink); }
    .card a { color: inherit; text-decoration: none; }
    .card a:hover { color: var(--link); }
    /* On phones the card opens under the map, full width, over the caption and list. */
    @media (max-width: 640px) { .place:not(.on, .online) span { display: none; } .card { left: 0; right: 0; top: 100%; width: auto; margin-top: 8px; translate: none !important; } }
  </style>
</head>
<body>
  <nav aria-label="Main">
    <a href="https://baggiponte.com/">← ai field notes</a>
    <div class="theme">
      <button type="button" title="Change theme" aria-label="Change theme" aria-haspopup="menu" aria-expanded="false">
        <svg class="light" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        <svg class="dark" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        <svg class="system" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M 11.996094,2 C 6.4986225,2.0192368 2.03125,6.5024993 2.03125,12 c 0,5.497501 4.4673725,9.980763 9.964844,10 H 12 12.0039 c 5.497471,-0.01924 9.964844,-4.502499 9.964844,-10 0,-5.4975007 -4.467373,-9.9807632 -9.964844,-10 H 12 Z M 12,4 c 4.417218,0.017598 7.96875,3.5822356 7.96875,8 0,4.417764 -3.551532,7.982402 -7.96875,8 z"/></svg>
      </button>
      <div role="menu" hidden>
        <button type="button" role="menuitemradio" data-item="light">Light</button>
        <button type="button" role="menuitemradio" data-item="dark">Dark</button>
        <button type="button" role="menuitemradio" data-item="system">System</button>
      </div>
    </div>
  </nav>
  <main>
    <header>
      <h1>talks</h1>
      <p>Slides, code and conversations from Luca Baggi's talks.</p>
    </header>
    <nav class="views" aria-label="View">
      <a href="#" data-view="talks">by talk</a>
      <a href="#timeline" data-view="timeline">timeline</a>
      <a href="#map" data-view="map">map</a>
    </nav>
    <!-- talks -->
    <section class="timeline" aria-label="Timeline">
    <!-- timeline -->
    </section>
    <section class="map" aria-label="Map">
    <!-- map -->
    </section>
  </main>
  <footer>These are historical talks; examples reflect the tools available when presented.</footer>
  <script>
    const toggle = document.querySelector(".theme");
    const button = toggle.querySelector(":scope > button");
    const menu = toggle.querySelector("[role=menu]");
    const apply = () => {
      const current = localStorage.getItem("color-theme") || "light";
      const dark = current === "dark" || (current === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.classList.toggle("dark", dark);
      toggle.dataset.theme = current;
      for (const item of menu.children) item.setAttribute("aria-checked", item.dataset.item === current);
    };
    const open = state => { menu.hidden = !state; button.setAttribute("aria-expanded", state); };
    button.addEventListener("click", () => open(menu.hidden));
    menu.addEventListener("click", event => {
      const item = event.target.closest("[data-item]");
      if (!item) return;
      localStorage.setItem("color-theme", item.dataset.item);
      apply();
      open(false);
    });
    document.addEventListener("click", event => { if (!toggle.contains(event.target)) open(false); });
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", apply);
    apply();
  </script>
  <script>
    // "#timeline" and "#map" switch views; they match no element id, so the page does not scroll.
    const main = document.querySelector("main");
    const route = () => {
      main.dataset.view = ["#timeline", "#map"].includes(location.hash) ? location.hash.slice(1) : "talks";
      for (const view of document.querySelectorAll(".views a")) view.toggleAttribute("aria-current", view.dataset.view === main.dataset.view);
    };
    addEventListener("hashchange", route);
    route();

    // Lights up every appearance of one talk: hovering or focusing previews it, a click or tap keeps it.
    const timeline = main.querySelector(".timeline");
    const caption = timeline.querySelector(".caption");
    const hint = caption.textContent;
    let selected = null;
    const show = talk => {
      timeline.classList.toggle("active", talk !== null);
      for (const mark of timeline.querySelectorAll("[data-talk]")) mark.classList.toggle("on", mark.dataset.talk === talk);
      if (talk === null) return void (caption.textContent = hint);
      const count = timeline.querySelectorAll(`button[data-talk="${talk}"]`).length;
      const title = document.createElement("strong");
      title.textContent = timeline.querySelector(`li[data-talk="${talk}"] .talk`).textContent;
      caption.replaceChildren(title, `, given ${["once", "twice"][count - 1] || `${count} times`}`);
    };
    const talkOf = event => event.target.closest("[data-talk]")?.dataset.talk ?? null;
    timeline.addEventListener("pointerover", event => show(talkOf(event) ?? selected));
    timeline.addEventListener("pointerleave", () => show(selected));
    timeline.addEventListener("focusin", event => show(talkOf(event) ?? selected));
    timeline.addEventListener("focusout", () => show(selected));
    timeline.addEventListener("click", event => {
      if (event.target.closest("a")) return;
      const talk = talkOf(event);
      show(selected = talk === selected ? null : talk);
    });
    addEventListener("keydown", event => event.key === "Escape" && show(selected = null));

    // A city shows the talks given there; a talk lights up every city it went to. Same hover / tap rules as the timeline.
    const map = main.querySelector(".map");
    const mapCaption = map.querySelector(".caption");
    const mapHint = mapCaption.textContent;
    let pinned = null;
    const reveal = mark => {
      const talk = mark?.dataset.talk ?? null;
      const city = talk === null ? mark?.dataset.city ?? null : null;
      map.classList.toggle("active", mark !== null);
      for (const row of map.querySelectorAll("li[data-talk]")) row.classList.toggle("on", row.dataset.talk === talk || row.dataset.city === city);
      for (const place of map.querySelectorAll(".place")) place.classList.toggle("on", place.dataset.city === city || place.dataset.talks.split(" ").includes(talk));
      for (const card of map.querySelectorAll(".card")) card.classList.toggle("on", card.dataset.city === city);
      if (talk === null) return void (mapCaption.textContent = mapHint);
      const places = [...map.querySelectorAll(".place.on")].map(place => place.dataset.city);
      const count = map.querySelectorAll(`li[data-talk="${talk}"]`).length;
      const title = document.createElement("strong");
      title.textContent = map.querySelector(`li[data-talk="${talk}"] .talk`).textContent;
      const where = places.length > 1 ? `${places.slice(0, -1).join(", ")} and ${places.at(-1)}` : places[0];
      mapCaption.replaceChildren(title, `, given ${["once", "twice"][count - 1] || `${count} times`} in ${where}`);
    };
    // Rows carry data-talk; city circles and their cards carry only data-city.
    const markOf = event => event.target.closest("[data-talk], [data-city]");
    const key = mark => mark && (mark.dataset.talk === undefined ? `city ${mark.dataset.city}` : `talk ${mark.dataset.talk}`);
    map.addEventListener("pointerover", event => reveal(markOf(event) ?? pinned));
    map.addEventListener("pointerleave", () => reveal(pinned));
    map.addEventListener("focusin", event => reveal(markOf(event) ?? pinned));
    map.addEventListener("focusout", () => reveal(pinned));
    map.addEventListener("click", event => {
      if (event.target.closest("a")) return;
      const mark = markOf(event);
      if (mark?.closest(".card")) return;
      reveal(pinned = mark && key(mark) !== key(pinned) ? mark : null);
    });
    addEventListener("keydown", event => event.key === "Escape" && reveal(pinned = null));
  </script>
</body>
</html>
