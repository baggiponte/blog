<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Slides and recordings from Luca Baggi's talks.">
    <link rel="canonical" href="https://talks.baggiponte.com/">
    <title>talks · luca baggi</title>
    <script>
    // Same "color-theme" values as the blog's toggle: light (default), dark or system. Runs before paint, and again from the menu.
    const applyTheme = () => {
      const theme = localStorage.getItem("color-theme") || "light";
      document.documentElement.classList.toggle(
        "dark",
        theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches),
      );
      return theme;
    };
    applyTheme();
    </script>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <nav aria-label="Main">
      <a href="https://baggiponte.com/">← ai field notes</a>
      <div class="theme">
        <button type="button" title="Change theme" aria-label="Change theme" aria-haspopup="menu" aria-expanded="false">
          <svg
            class="light"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
            />
          </svg>
          <svg
            class="dark"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
            />
          </svg>
          <svg
            class="system"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            aria-hidden="true"
          >
            <path
              d="M 11.996094,2 C 6.4986225,2.0192368 2.03125,6.5024993 2.03125,12 c 0,5.497501 4.4673725,9.980763 9.964844,10 H 12 12.0039 c 5.497471,-0.01924 9.964844,-4.502499 9.964844,-10 0,-5.4975007 -4.467373,-9.9807632 -9.964844,-10 H 12 Z M 12,4 c 4.417218,0.017598 7.96875,3.5822356 7.96875,8 0,4.417764 -3.551532,7.982402 -7.96875,8 z"
            />
          </svg>
        </button>
        <div role="menu" hidden>
          <button type="button" role="menuitemradio" aria-checked="false" data-item="light">Light</button>
          <button type="button" role="menuitemradio" aria-checked="false" data-item="dark">Dark</button>
          <button type="button" role="menuitemradio" aria-checked="false" data-item="system">System</button>
        </div>
      </div>
    </nav>
    <main>
      <header>
        <h1>talks</h1>
        <p>Slides, code and conversations from Luca Baggi's talks.</p>
      </header>
      <nav class="views" aria-label="View">
        <a href="#map" data-view="map">map</a>
