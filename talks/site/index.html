<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Slides and recordings from Luca Baggi's talks.">
  <link rel="canonical" href="https://talks.baggiponte.com/">
  <title>talks · luca baggi</title>
  <script>
    // Same "color-theme" values as the blog's toggle: light (default), dark or system.
    const theme = localStorage.getItem("color-theme") || "light";
    const dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.classList.toggle("dark", dark);
  </script>
  <style>
    :root {
      --bg: #f7f5f0; --ink: #151922; --muted: #687083; --border: rgba(18, 24, 38, .1); --link: hsl(212, 80%, 45%);
      color-scheme: light; font-family: system-ui, sans-serif; color: var(--ink);
      background: radial-gradient(circle at top left, rgba(99, 102, 241, .08), transparent 26rem), var(--bg) fixed;
    }
    :root.dark {
      --bg: #0e1014; --ink: #edf0f6; --muted: #9aa3b5; --border: rgba(229, 231, 235, .12); --link: hsl(212, 100%, 72%);
      color-scheme: dark;
    }
    body { max-width: 64rem; margin: 0 auto; padding: 48px 24px; line-height: 1.6; }
    nav { display: flex; justify-content: space-between; align-items: center; }
    nav, footer { font-size: .9rem; color: var(--muted); }
    a { color: var(--link); text-underline-offset: 3px; }
    nav a { color: inherit; }
    /* Mirrors the blog's hextra theme toggle: icon button plus a light/dark/system menu. */
    .theme { position: relative; }
    .theme button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    .theme > button { display: flex; padding: 8px; border-radius: 999px; }
    .theme > button:hover, [role=menu] button:hover { background: var(--border); color: var(--ink); }
    .theme svg { width: 24px; height: 24px; }
    .theme:not([data-theme=light]) .light, .theme:not([data-theme=dark]) .dark, .theme:not([data-theme=system]) .system { display: none; }
    [role=menu] { position: absolute; right: 0; top: 100%; z-index: 1; min-width: 100px; padding: 4px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, .1); }
    [role=menu] button { display: block; width: 100%; padding: 6px 36px 6px 12px; border-radius: 4px; text-align: left; position: relative; }
    [role=menu] [aria-checked=true]::after { content: "✓"; position: absolute; right: 12px; }
    header { margin: 64px 0 40px; }
    h1 { font-size: clamp(2.5rem, 8vw, 4rem); line-height: 1.1; letter-spacing: -.04em; margin: 0; }
    header p { color: var(--muted); font-size: 1.1rem; }
    article { padding: 26px 0; border-top: 1px solid var(--border); }
    h2 { font-size: 1.35rem; line-height: 1.3; letter-spacing: -.025em; margin: 0 0 8px; }
    h2 a { color: inherit; text-decoration: none; }
    h2 a:hover { color: var(--link); }
    article p { margin: 8px 0 16px; color: var(--muted); }
    article .meta { margin: 0; font-size: .95rem; }
    /* Every edition of a talk given more than once, newest first, as a timeline: a dot per edition on a thin line. */
    .editions { list-style: none; margin: 4px 0 0; padding: 0 0 0 28px; font-size: .9rem; }
    .editions li { position: relative; display: grid; grid-template-columns: 6.5rem minmax(0, 1fr) auto; gap: 0 16px; padding: 7px 0; }
    .editions li::before { content: ""; position: absolute; left: -24px; top: 14px; width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--muted); background: var(--bg); z-index: 1; }
    .editions li:first-child::before { border-color: var(--link); background: var(--link); box-shadow: 0 0 0 4px color-mix(in srgb, var(--link) 18%, transparent); }
    .editions li:not(:last-child)::after { content: ""; position: absolute; left: -19.5px; top: 19px; height: 100%; width: 1px; background: var(--muted); opacity: .35; }
    .editions time { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .editions li:first-child > span:first-of-type { font-weight: 600; }
    .editions em { display: block; color: var(--muted); }
    .editions .links { gap: 12px; font-size: inherit; justify-content: end; }
    .editions .links a { color: var(--muted); text-decoration-color: var(--border); }
    .editions .links a:hover { color: var(--link); text-decoration-color: currentColor; }
    .links { display: flex; flex-wrap: wrap; gap: 24px; font-size: .95rem; }
    /* Date column as in the blog's post list. */
    article { display: grid; grid-template-columns: minmax(0, 1fr) 8.5rem; column-gap: 2rem; }
    article > * { grid-column: 1; }
    article > time { grid-column: 2; grid-row: 1; justify-self: end; white-space: nowrap; color: var(--muted); font-size: .95rem; line-height: 1.5; }
    footer { margin-top: 48px; }
    :focus-visible { outline: 2px solid var(--link); outline-offset: 5px; }
    @media (max-width: 480px) { body { padding-top: 24px; } header { margin-top: 48px; } }
    @media (max-width: 640px) { article { grid-template-columns: 1fr; } article > time { grid-column: 1; grid-row: auto; justify-self: start; } .editions li { grid-template-columns: 1fr; padding: 6px 0; } .editions .links { justify-content: start; } }
  </style>
</head>
<body>
  <nav aria-label="Main">
    <a href="https://baggiponte.com/">← ai field notes</a>
    <div class="theme">
      <button type="button" title="Change theme" aria-label="Change theme" aria-haspopup="menu" aria-expanded="false">
        <svg class="light" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        <svg class="dark" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        <svg class="system" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M 11.996094,2 C 6.4986225,2.0192368 2.03125,6.5024993 2.03125,12 c 0,5.497501 4.4673725,9.980763 9.964844,10 H 12 12.0039 c 5.497471,-0.01924 9.964844,-4.502499 9.964844,-10 0,-5.4975007 -4.467373,-9.9807632 -9.964844,-10 H 12 Z M 12,4 c 4.417218,0.017598 7.96875,3.5822356 7.96875,8 0,4.417764 -3.551532,7.982402 -7.96875,8 z"/></svg>
      </button>
      <div role="menu" hidden>
        <button type="button" role="menuitemradio" data-item="light">Light</button>
        <button type="button" role="menuitemradio" data-item="dark">Dark</button>
        <button type="button" role="menuitemradio" data-item="system">System</button>
      </div>
    </div>
  </nav>
  <main>
    <header>
      <h1>talks</h1>
      <p>Slides, code and conversations from Luca Baggi's talks.</p>
    </header>
    <!-- talks -->
  </main>
  <footer>These are historical talks; examples reflect the tools available when presented.</footer>
  <script>
    const toggle = document.querySelector(".theme");
    const button = toggle.querySelector(":scope > button");
    const menu = toggle.querySelector("[role=menu]");
    const apply = () => {
      const current = localStorage.getItem("color-theme") || "light";
      const dark = current === "dark" || (current === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.classList.toggle("dark", dark);
      toggle.dataset.theme = current;
      for (const item of menu.children) item.setAttribute("aria-checked", item.dataset.item === current);
    };
    const open = state => { menu.hidden = !state; button.setAttribute("aria-expanded", state); };
    button.addEventListener("click", () => open(menu.hidden));
    menu.addEventListener("click", event => {
      const item = event.target.closest("[data-item]");
      if (!item) return;
      localStorage.setItem("color-theme", item.dataset.item);
      apply();
      open(false);
    });
    document.addEventListener("click", event => { if (!toggle.contains(event.target)) open(false); });
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", apply);
    apply();
  </script>
</body>
</html>
