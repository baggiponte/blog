# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Audit every push, including documentation-only changes.
  push:
    branches: ["main"]

  # Runs on pull requests for dev preview
  pull_request:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Builds only need to read source; deployment permissions are scoped below.
permissions:
  contents: read

# PR checks do not queue behind production; never cancel an active deployment.
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  security:
    name: Audit workflows and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Scan complete history, not just the staged diff.
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24"
          cache: false
      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.5"
          enable-cache: false
      - name: Audit workflows
        env:
          GH_TOKEN: ${{ github.token }} # Read-only token enables online pin/ref audits.
        run: uvx --from prek==0.5.7 prek run zizmor --all-files
      - name: Scan complete Git history for secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --verbose

  # Build job
  build:
    name: Build Hugo site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUGO_VERSION: 0.164.0
      HUGO_DEB_SHA256: 8325f3653032d0fc536503691f4833dc4eb6c6be02ee62466758f3f37a7f2fcd
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # fetch all history for .GitInfo and .Lastmod
          submodules: recursive
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24"
      - name: Setup Hugo
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          printf '%s  %s\n' "$HUGO_DEB_SHA256" "$RUNNER_TEMP/hugo.deb" | sha256sum --check --strict
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
      - name: Build with Hugo
        env:
          # For maximum backward compatibility with Hugo modules
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        # hugo.yaml owns the canonical production baseURL for both hosts.
        run: hugo --gc --minify
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public

  # Deployment job
  deploy:
    name: Deploy GitHub Pages
    # Manual dispatches from feature branches must not deploy production either.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, security]
    permissions:
      pages: write # Publish the Pages artifact; no repository write permission.
      id-token: write # Authenticate this deployment to Pages with OIDC.
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
