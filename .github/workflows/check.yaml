# Checks only: production is deployed by Cloudflare Workers Builds on push to main
# (see README), so PRs are the only place these need to run.
name: Check blog

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  security:
    name: Audit workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.5"
          enable-cache: false
      - name: Audit workflows
        run: uvx --from prek==0.5.7 prek run zizmor --all-files

  notebooks:
    name: Check notebook exports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.5"
          enable-cache: false
      - name: Export notebooks
        run: uvx --from rust-just==1.59.0 just marimo-export
      # The version line changes on every marimo bump, so a Renovate PR passes
      # unless the new marimo actually exports different Markdown.
      - name: Fail on stale exports
        run: |
          git add --intent-to-add content/blog
          if ! git diff --exit-code --ignore-matching-lines='^marimo-version: ' -- content/blog; then
            echo "::error::Notebook exports are stale; run 'just marimo-export' and commit the result."
            exit 1
          fi

  build:
    # Same commands as Workers Builds, so a red check means Cloudflare would fail too.
    # The job name is a required check in the main branch ruleset: keep it when adding steps.
    name: Build site and dry-run deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Check formatting and lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Run unit tests
        run: pnpm test:unit
      - name: Build site and dry-run Cloudflare deploy
        run: pnpm check
      # The runner image already ships Chromium's libraries; --with-deps only adds a
      # ~1 min apt run. Tests use full Chromium, so skip the headless shell too.
      - name: Install Chromium
        run: pnpm exec playwright install --no-shell chromium
      - name: Run browser tests
        run: pnpm test
