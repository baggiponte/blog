# Checks only: production is deployed by Cloudflare Workers Builds on push to main
# (see README), so PRs are the only place these need to run.
name: Check blog

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  security:
    name: Audit workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.5"
          enable-cache: false
      - name: Audit workflows
        run: uvx --from prek==0.5.7 prek run zizmor --all-files

  build:
    # Same commands as Workers Builds, so a red check means Cloudflare would fail too.
    name: Build site and dry-run deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      HUGO_VERSION: 0.168.0
      HUGO_DEB_SHA256: b7cd5087c39bf5584e40180bd04fab0c6fb19f2913cd63121da8663e112a08db
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24"
      - name: Setup Hugo
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          printf '%s  %s\n' "$HUGO_DEB_SHA256" "$RUNNER_TEMP/hugo.deb" | sha256sum --check --strict
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Build site and dry-run Cloudflare deploy
        run: pnpm check
