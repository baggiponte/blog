# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f # v1.31.1
    hooks:
      - id: zizmor
        args: [--no-progress, --persona, pedantic, --no-ignores]
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: marimo-export-notebooks
        name: Export marimo notebooks to markdown
        language: system
        files: ^content/blog/[^/]+/[^/]+\.py$
        pass_filenames: true
        entry: just marimo-export
