# Run with prek (`uvx --from prek==0.5.7 prek install`); CI runs the zizmor hook too.
repos:
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1 # v1.31.1
    hooks:
      - id: zizmor
        args: [--no-progress, --persona, pedantic, --no-ignores]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1 # v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      # Formats and lints the staged files Biome covers (see biome.jsonc) with the Biome in package.json.
      - id: biome
        name: biome check
        entry: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true
        language: system
        types_or: [javascript, ts, json, css]
      - id: marimo-export-notebooks
        name: Export marimo notebooks to markdown
        language: system
        files: ^content/blog/[^/]+/[^/]+\.py$
        pass_filenames: true
        entry: just marimo-export
